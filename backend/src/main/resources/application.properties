# Active profile defaults to H2 for instant out-of-the-box local execution
spring.profiles.active=h2

# Application Configuration
spring.application.name=expense-tracker

# JWT Configuration (256-bit secret key)
app.jwt.secret=9a67423a7b687d32c918c50e42d76f82798e4f16b23b169542a229a8f4c2eef9
app.jwt.expiration-ms=86400000

# Server port
server.port=8080

# OpenAPI Swagger documentation custom path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Enable H2 frame options for console
spring.headers.frame-options=sameorigin
